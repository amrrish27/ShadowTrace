services:
  - type: web
    name: shadowtrace
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ST_ENV
        value: development
      - key: ST_ALLOWED_HOSTS
        value: "*"
      - key: ST_CORS_ORIGINS
        value: "*"
      - key: ST_BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.test
      - key: ST_BOOTSTRAP_ADMIN_PASSWORD
        value: Bootstrap-Admin-Pass-9!
